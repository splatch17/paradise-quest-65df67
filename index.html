<style>
/* Console de poche commune aux jeux G2 : écran agrandi au pixel près, croix et boutons A/B sur mobile.
   Thème volontairement unique (nuit tropicale) : toutes les couleurs sont explicites. */
:root {
  color-scheme: dark;
  --night: #15132a;
  --bezel: #2e2a5a;
  --bezel-edge: #463f86;
  --gold: #f2c35a;
  --text: #ece8fa;
  --muted: #a39dc8;
  --rose: #e8385e;
  --display: "Press Start 2P", ui-monospace, monospace;
  --body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--text); font: 16px/1.5 var(--body); overflow-x: hidden; }
main {
  min-height: 100%; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  padding-block: 18px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1 { font: 12px/1.4 var(--display); color: var(--gold); margin: 0; letter-spacing: 0.08em; text-align: center; }
.console {
  background: var(--bezel); border: 2px solid var(--bezel-edge); border-radius: 18px;
  padding: 12px; display: grid; gap: 14px; justify-items: center; max-width: 100%; box-sizing: border-box;
}
.screen-wrap { background: #000; border-radius: 6px; padding: 6px; max-width: 100%; box-sizing: border-box; }
canvas#screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; max-width: 100%; }
.pad { display: none; width: 100%; justify-content: space-between; align-items: center; padding: 4px 8px 6px; box-sizing: border-box; }
@media (hover: none), (pointer: coarse) { .pad { display: flex; } .help { display: none; } }
.dpad { display: grid; grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); }
.dpad [data-key="up"] { grid-area: 1 / 2; }
.dpad [data-key="left"] { grid-area: 2 / 1; }
.dpad [data-key="right"] { grid-area: 2 / 3; }
.dpad [data-key="down"] { grid-area: 3 / 2; }
.pad button {
  font: 14px var(--display); color: var(--text); background: #1d1a3c; border: 2px solid #121026;
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: pointer;
}
.dpad button { border-radius: 6px; }
.pad button.on { background: #4b4590; }
.ab { display: flex; gap: 14px; align-items: center; transform: rotate(-14deg); }
.ab button { width: 58px; height: 58px; border-radius: 50%; background: #7a2848; border-color: #3c1024; }
.ab .a { margin-top: -28px; background: #a8304e; }
.pad button:focus-visible { outline: 3px solid var(--rose); outline-offset: 3px; }
.help { margin: 0; color: var(--muted); font-size: 14px; text-align: center; max-width: 60ch; }
.help kbd { font: 10px var(--display); color: var(--gold); background: #24204a; padding: 3px 6px; border-radius: 4px; }
</style>
<style>
/* Écran final commun aux deux jeux : photo de la demande, puis faire-part (voir js/finale.js) */
#pq-finale {
  --pq-ink: #3a2418;
  --pq-paper: #fbf3e2;
  --pq-gold: #ffd84a;
  --pq-rose: #c0304e;
  --pq-frame: #b07838;
  position: fixed; inset: 0; z-index: 20; overflow-y: auto; box-sizing: border-box;
  background: radial-gradient(circle at 50% 30%, #fff8ea 0%, #f6e6c8 60%, #eed6ae 100%);
  color: var(--pq-ink);
  padding-block: max(28px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#pq-finale[hidden] { display: none; }
#pq-finale section {
  min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 22px; text-align: center;
}
#pq-finale[data-step="photo"] .pq-invite-step,
#pq-finale[data-step="invite"] .pq-photo-step { display: none; }

.pq-polaroid {
  margin: 0; background: #ffffff; padding: 12px 12px 18px; box-sizing: border-box; max-width: min(460px, 100%);
  box-shadow: 0 12px 30px rgba(80, 50, 20, 0.25); transform: rotate(-2deg);
  animation: pq-develop 2.4s ease-out both;
}
.pq-polaroid img { display: block; width: auto; max-width: 100%; max-height: 58vh; height: auto; margin: 0 auto; }
.pq-polaroid figcaption { font: 15px/1.4 "Nunito Sans", system-ui, sans-serif; margin-top: 10px; color: #6a5040; }
@keyframes pq-develop { from { opacity: 0; filter: brightness(2.2) saturate(0); } to { opacity: 1; filter: none; } }
.pq-kicker { font: 14px/1.6 "Press Start 2P", ui-monospace, monospace; color: var(--pq-rose); margin: 0; }

.pq-btn {
  font: 12px "Press Start 2P", ui-monospace, monospace; color: var(--pq-ink); background: var(--pq-gold);
  border: 3px solid var(--pq-ink); padding: 12px 18px; border-radius: 6px; cursor: pointer; box-shadow: 0 4px 0 var(--pq-ink);
}
.pq-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--pq-ink); }
.pq-btn:focus-visible { outline: 3px solid #f85888; outline-offset: 3px; }

.pq-invite-file { display: none; max-width: min(560px, 100%); height: auto; box-shadow: 0 12px 30px rgba(80, 50, 20, 0.25); }
.pq-invite.has-file .pq-invite-file { display: block; }
.pq-invite.has-file .pq-card { display: none; }

.pq-card {
  position: relative; box-sizing: border-box; width: min(420px, 100%);
  background: var(--pq-paper); border: 4px double var(--pq-frame); border-radius: 4px;
  padding: 44px 28px 40px; display: grid; gap: 10px; justify-items: center;
  box-shadow: 0 12px 30px rgba(80, 50, 20, 0.2);
}
.pq-card p { margin: 0; }
.pq-level { font: 10px/1.6 "Press Start 2P", ui-monospace, monospace; color: var(--pq-frame); letter-spacing: 0.12em; }
.pq-names { font: 700 clamp(26px, 7vw, 34px)/1.2 "Nunito Sans", system-ui, sans-serif; text-wrap: balance; }
.pq-names span { color: var(--pq-rose); }
.pq-marry { font: italic 18px/1.4 "Nunito Sans", system-ui, sans-serif; color: #6a5040; }
.pq-heart { padding-block: 4px; }
.pq-date { font: 15px/1.6 "Press Start 2P", ui-monospace, monospace; color: var(--pq-rose); }
.pq-note { font: 14px/1.5 "Nunito Sans", system-ui, sans-serif; color: #7a6050; }
.pq-pixel { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.pq-flower { position: absolute; }
.pq-tl { top: 10px; left: 10px; }
.pq-tr { top: 10px; right: 10px; }
.pq-bl { bottom: 10px; left: 10px; }
.pq-br { bottom: 10px; right: 10px; }
@media (prefers-reduced-motion: reduce) { .pq-polaroid { animation: none; } }

/* Faire-part du jeu en pixel art (js/jeu_pixel.js) : plage d'Anse Patate en fond, grande photo en polaroïd posée

#pq-finale.pq-fp-scene[data-step="invite"] {
  background: linear-gradient(rgba(255, 246, 228, 0.5), rgba(255, 246, 228, 0.7)), var(--pq-fp-bg) center / cover no-repeat, #f3dfb8;
  image-rendering: pixelated;
}
#pq-finale .pq-fp.pq-card-custom {
  display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center;
  width: min(1280px, 100%); max-width: none; box-shadow: none; image-rendering: auto;
  padding-inline: 3vw; box-sizing: border-box;
}
.pq-fp-photo { position: relative; z-index: 1; margin-right: -5%; transform: rotate(-4deg); max-width: none; }
.pq-fp-photo { padding-bottom: 12px; }
.pq-fp-photo img { height: min(70vh, 680px); width: auto; max-width: 100%; max-height: none; image-rendering: auto; }

}

<script>
// Moteur commun aux jeux en style G2 (pixel art de la planche).
// Le décor est dessiné à la résolution native de la planche (208 × 112), puis agrandi ×2 ; l'interface
// (dialogues, indications, compteurs) est dessinée directement à l'écran, à double résolution, dans le
// style de la planche : parchemin cerné de brun, plaques bleu nuit à lettres dorées.
(function () {
  "use strict";
  const PQ = (window.PQ = window.PQ || {});
  // Chemin d'une image ; dans la version autonome (un seul fichier HTML), l'image est intégrée (window.PQ_ASSETS)
  PQ.asset = (path) => (window.PQ_ASSETS && window.PQ_ASSETS[path]) || path;

  PQ.moteurG = function (opts) {
    // S : échelle de l'interface (ses coordonnées vont de 0 à W × S) ; P : pixels d'écran par unité du jeu ;
    // R : finesse des images (R fois plus de pixels que d'unités du jeu). Pixel art : P = 2, R = 1 ;
    // version HD : P = R = 6 (images 6 fois plus fines, interface agrandie 3 fois), dessin lissé.
    const W = opts.w || 208, H = opts.h || 112, S = 2, P = opts.px || S, U = P / S;
    const R = opts.r || (opts.hd ? 2 : 1), SMOOTH = !!opts.smooth;
    const screen = document.getElementById("screen");
    screen.width = W * P;
    screen.height = H * P;
    const out = screen.getContext("2d");
    const world = document.createElement("canvas");
    world.width = W * R;
    world.height = H * R;
    const ctx = world.getContext("2d");

    const UI = {
      paper: "#f4e2c0", paperLine: "#fff4dc", ink: "#3a2416", border: "#3a2416",
      plate: "#1e2236", plateEdge: "#4a4f6e", gold: "#f2c35a", white: "#f4eee2", rose: "#e8385e"
    };
    const FONT = '"Press Start 2P", monospace';

    // ------------------------------------------------------------------ Images
    const img = {};
    function load(map) {
      return Promise.all(Object.entries(map).map(([k, src]) => new Promise((ok) => {
        const im = new Image();
        im.onload = () => { img[k] = im; ok(); };
        im.onerror = () => { console.warn("image manquante", src); ok(); };
        im.src = PQ.asset(src);
      })));
    }
    const flipped = new Map();
    function flip(name) {
      if (!flipped.has(name)) {
        const src = img[name], c = document.createElement("canvas");
        c.width = src.width;
        c.height = src.height;
        const g = c.getContext("2d");
        g.translate(src.width, 0);
        g.scale(-1, 1);
        g.drawImage(src, 0, 0);
        flipped.set(name, c);
      }
      return flipped.get(name);
    }
    const snap = (v) => Math.round(v * R) / R; // position calée sur un pixel de l'image
    // Dessine une image : (x, pied) = centre en bas. En HD, les images sont deux fois plus grandes en pixels
    // mais occupent la même place dans le jeu.
    function sprite(name, x, feet, mirror) {
      const im = mirror ? flip(name) : img[name];
      if (!im) return;
      const w = im.width / R, h = im.height / R;
      ctx.drawImage(im, snap(x - w / 2), snap(feet - h), w, h);
    }
    // Dessine une image (nom ou canvas) par son coin haut gauche
    function blit(name, x, y) {
      const im = typeof name === "string" ? img[name] : name;
      if (im) ctx.drawImage(im, snap(x), snap(y), im.width / R, im.height / R);
    }
    const size = (name) => (img[name] ? { w: img[name].width / R, h: img[name].height / R } : { w: 0, h: 0 });

    // ------------------------------------------------------------------ Entrées
    const input = { left: false, right: false, up: false, down: false, a: false, b: false };
    const KEYS = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", Enter: "a", NumpadEnter: "a", Space: "b" };
    const isPress = (k) => k === "a" || k === "b";
    // Touches tout juste enfoncées (flèches comprises) : un appui bref entre deux images n'est pas perdu
    const taps = new Set();
    function tap(k) {
      const v = taps.has(k);
      taps.delete(k);
      return v;
    }
    addEventListener("keydown", (e) => {
      const k = KEYS[e.code];
      if (!k) return;
      e.preventDefault();
      if (!e.repeat) taps.add(k);
      if (!isPress(k) || !e.repeat) input[k] = true;
    });
    addEventListener("keyup", (e) => {
      const k = KEYS[e.code];
      if (k && !isPress(k)) input[k] = false;
    });
    document.querySelectorAll("[data-key]").forEach((btn) => {
      const k = btn.dataset.key;
      btn.addEventListener("pointerdown", (e) => { e.preventDefault(); input[k] = true; taps.add(k); btn.classList.add("on"); });
      ["pointerup", "pointerleave", "pointercancel"].forEach((ev) =>
        btn.addEventListener(ev, () => { if (!isPress(k)) input[k] = false; btn.classList.remove("on"); })
      );
    });
    screen.addEventListener("pointerdown", () => (input.a = true));
    function consume(k) {
      const v = input[k];
      input[k] = false;
      return v;
    }
    function anyPress() {
      const a = consume("a"), b = consume("b");
      return a || b;
    }

    // ------------------------------------------------------------------ Interface (à l'échelle de l'écran)
    function text(s, x, y, color, size, shadow) {
      out.font = (size || 8) + "px " + FONT;
      out.textBaseline = "top";
      if (shadow) {
        out.fillStyle = shadow;
        out.fillText(s, x + 1, y + 1);
      }
      out.fillStyle = color;
      out.fillText(s, x, y);
    }
    function centerText(s, y, color, size, shadow) {
      out.font = (size || 8) + "px " + FONT;
      text(s, Math.round((W * S - out.measureText(s).width) / 2), y, color, size, shadow);
    }
    // Parchemin cerné de brun, coins arrondis d'un pixel (comme les bulles de la planche)
    function paper(x, y, w, h) {
      out.fillStyle = UI.border;
      out.fillRect(x + 2, y, w - 4, h);
      out.fillRect(x, y + 2, w, h - 4);
      out.fillRect(x + 1, y + 1, w - 2, h - 2);
      out.fillStyle = UI.paper;
      out.fillRect(x + 3, y + 3, w - 6, h - 6);
      out.fillStyle = UI.paperLine;
      out.fillRect(x + 4, y + 4, w - 8, 2);
    }
    // Plaque bleu nuit à liseré clair (étiquettes de la planche : FRANCE > SEYCHELLES, MISSION ACTIVÉE…)
    function plate(x, y, w, h) {
      out.fillStyle = UI.plateEdge;
      out.fillRect(x + 1, y, w - 2, h);
      out.fillRect(x, y + 1, w, h - 2);
      out.fillStyle = UI.plate;
      out.fillRect(x + 2, y + 2, w - 4, h - 4);
    }
    function centerPlate(lines, y, color) {
      out.font = "8px " + FONT;
      const w = Math.max(...lines.map((l) => out.measureText(l).width)) + 24, h = lines.length * 14 + 12;
      const x = Math.round((W * S - w) / 2);
      plate(x, y, w, h);
      lines.forEach((l, i) => text(l, x + 12, y + 8 + i * 14, color || UI.gold));
    }
    function heart(x, y, color, size) {
      const rows = [".XX.XX.", "XXXXXXX", "XXXXXXX", ".XXXXX.", "..XXX..", "...X..."];
      const s = size || 1;
      ctx.fillStyle = color || UI.rose;
      rows.forEach((r, j) => r.split("").forEach((c, i) => c === "X" && ctx.fillRect(Math.round(x + i * s), Math.round(y + j * s), s, s)));
    }

    // ------------------------------------------------------------------ Dialogues
    const talk = { queue: null, i: 0, n: 0, done: null };
    function say(list, done) {
      talk.queue = list;
      talk.i = 0;
      talk.n = 0;
      talk.done = done || null;
    }
    function wrap(s, max) {
      const lines = [""];
      s.split(" ").forEach((w) => {
        const cur = lines[lines.length - 1];
        if (cur && (cur + " " + w).length > max) lines.push(w);
        else lines[lines.length - 1] = cur ? cur + " " + w : w;
      });
      return lines;
    }
    function updateTalk(dt) {
      const full = talk.queue[talk.i].text;
      talk.n = Math.min(full.length, talk.n + dt * 45);
      if (!anyPress()) return;
      if (talk.n < full.length) talk.n = full.length;
      else if (++talk.i < talk.queue.length) talk.n = 0;
      else {
        const done = talk.done;
        talk.queue = null;
        if (done) done();
      }
    }
    function drawTalk(t) {
      if (!talk.queue) return;
      const m = talk.queue[talk.i];
      let left = Math.floor(talk.n);
      const lines = wrap(m.text, 46).map((l) => {
        const s = l.slice(0, Math.max(0, left));
        left -= l.length + 1;
        return s;
      });
      const h = 22 + lines.length * 14, x = 8, w = W * S - 16, y = H * S - 8 - h;
      paper(x, y, w, h);
      lines.forEach((l, i) => text(l, x + 14, y + 12 + i * 14, UI.ink));
      if (m.who) {
        out.font = "8px " + FONT;
        const pw = out.measureText(m.who).width + 16;
        plate(x + 10, y - 12, pw, 18);
        text(m.who, x + 18, y - 7, UI.gold);
      }
      if (talk.n >= m.text.length && Math.floor(t * 2) % 2 === 0) {
        out.fillStyle = UI.rose;
        const ax = x + w - 18, ay = y + h - 14 + (Math.floor(t * 4) % 2);
        out.fillRect(ax, ay, 8, 2);
        out.fillRect(ax + 2, ay + 2, 4, 2);
      }
    }

    // ------------------------------------------------------------------ Scènes, fondus, boucle
    const scenes = {};
    let scene = null;
    const fade = { a: 1, dir: -1, next: null, color: "#000000" };
    function go(name, color) {
      if (fade.dir === 1) return;
      fade.dir = 1;
      fade.next = name;
      fade.color = color || "#000000";
    }
    function start(name) {
      talk.queue = null;
      scene = scenes[name];
      scene.name = name;
      scene.enter();
    }
    PQ.game = {
      get scene() { return scene && scene.name; },
      get state() { return scene; },
      get talking() { return !!talk.queue; },
      frames: 0
    };
    let T = 0;
    function step(dt) {
      T += dt;
      if (fade.dir === 1) {
        fade.a += dt * 3;
        if (fade.a >= 1) {
          fade.a = 1;
          fade.dir = -1;
          start(fade.next);
        }
      } else if (fade.dir === -1) {
        fade.a -= dt * 3;
        if (fade.a <= 0) {
          fade.a = 0;
          fade.dir = 0;
        }
      }
      if (talk.queue) updateTalk(dt);
      else if (fade.dir !== 1) scene.update(dt);
      ctx.setTransform(R, 0, 0, R, 0, 0);
      ctx.imageSmoothingEnabled = SMOOTH;
      ctx.imageSmoothingQuality = "high";
      ctx.clearRect(0, 0, W, H);
      scene.draw(T);
      out.setTransform(1, 0, 0, 1, 0, 0);
      out.imageSmoothingEnabled = false;
      out.drawImage(world, 0, 0, W * P, H * P);
      out.setTransform(U, 0, 0, U, 0, 0); // l'interface est dessinée dans l'espace W × S, agrandi si besoin
      if (scene.ui) scene.ui(T);
      drawTalk(T);
      if (fade.a > 0) {
        out.globalAlpha = fade.a;
        out.fillStyle = fade.color;
        out.fillRect(0, 0, W * S, H * S);
        out.globalAlpha = 1;
      }
      input.a = input.b = false;
      taps.clear();
      PQ.game.frames++;
    }
    let last = performance.now();
    function loop(now) {
      step(Math.min(0.05, (now - last) / 1000));
      last = now;
      requestAnimationFrame(loop);
    }
    const params = new URLSearchParams(location.search);
    PQ.game.step = (n) => {
      for (let i = 0; i < n; i++) step(1 / 60);
    };
    function run(first) {
      const fontReady = document.fonts && document.fonts.load ? document.fonts.load("8px " + FONT) : Promise.resolve();
      Promise.race([fontReady, new Promise((r) => setTimeout(r, 1500))]).then(() => {
        start(params.get("scene") || first);
        if (!params.has("test")) requestAnimationFrame(loop);
      });
    }

    return {
      W, H, S, R, ctx, out, img, UI, load, sprite, blit, size, flip, input, consume, anyPress, tap,
      text, centerText, paper, plate, centerPlate, heart, say, scenes, go, run,
      get talking() { return !!talk.queue; }
    };
  };
})();
</script>
<script>
// Écran final commun aux deux jeux : la vraie photo de la demande, puis le faire-part.
// PQ.finale.show(onReplay) affiche l'écran ; « Rejouer » le referme et appelle onReplay.
// Si faire_part/faire_part.png existe, il remplace la carte provisoire.
(function () {
  const PQ = window.PQ;
  const asset = PQ.asset || ((path) => path); // le jeu 1 (index.html) n'a pas le moteur G

  const HIBISCUS = [
    "..P...P..",
    ".PPP.PPP.",
    "PPPPpPPPP",
    ".PPpYpPP.",
    "..pYYYp..",
    ".PPpYpPP.",
    "PPPPpPPPP",
    ".PPP.PPP.",
    "..P...P.."
  ];
  const HEART = [".XX.XX.", "XXXXXXX", "XXXXXXX", ".XXXXX.", "..XXX..", "...X..."];

  // Petit dessin pixel art dans un canvas agrandi par CSS
  function pixelArt(rows, pal, scale) {
    const c = document.createElement("canvas");
    c.width = rows[0].length;
    c.height = rows.length;
    const ctx = c.getContext("2d");
    rows.forEach((row, y) => row.split("").forEach((k, x) => {
      if (pal[k]) {
        ctx.fillStyle = pal[k];
        ctx.fillRect(x, y, 1, 1);
      }
    }));
    c.style.width = c.width * scale + "px";
    c.style.height = c.height * scale + "px";
    c.className = "pq-pixel";
    c.setAttribute("aria-hidden", "true");
    return c;
  }

  const root = document.createElement("div");
  root.id = "pq-finale";
  root.hidden = true;
  root.dataset.step = "photo";
  root.innerHTML = `
    <section class="pq-photo-step">
      <figure class="pq-polaroid">
        <img class="pq-photo-main" alt="Maxime à genou devant Flora sous l'arche fleurie d'Anse Patate">
        <figcaption>La demande · Anse Patate, La Digue</figcaption>
      </figure>
      <p class="pq-kicker">Elle a dit oui !</p>
      <button type="button" class="pq-btn" data-go="invite">Ouvrir le faire-part</button>
    </section>
    <section class="pq-invite-step">
      <div class="pq-invite">
        <img class="pq-invite-file" alt="Faire-part de mariage de Flora et Maxime">
        <div class="pq-card">
          <span class="pq-flower pq-tl"></span><span class="pq-flower pq-tr"></span>
          <span class="pq-flower pq-bl"></span><span class="pq-flower pq-br"></span>
          <p class="pq-level">SAVE THE DATE</p>
          <p class="pq-names">Flora <span>&amp;</span> Maxime</p>
          <p class="pq-marry">se marient</p>
          <p class="pq-heart"></p>
          <p class="pq-date">28 août 2027</p>
          <p class="pq-note">Faire-part et informations à suivre.</p>
        </div>
      </div>
      <button type="button" class="pq-btn" data-go="replay">Rejouer</button>
    </section>`;
  document.body.append(root);

  const flowerPal = { P: "#f0507a", p: "#b8244a", Y: "#ffd84a" };
  root.querySelectorAll(".pq-flower").forEach((el) => el.append(pixelArt(HIBISCUS, flowerPal, 4)));
  root.querySelector(".pq-heart").append(pixelArt(HEART, { X: "#e8385e" }, 3));

  root.querySelector(".pq-photo-main").src = asset("assets/photos/demande_genou.jpeg");
  const file = root.querySelector(".pq-invite-file");
  file.addEventListener("load", () => root.querySelector(".pq-invite").classList.add("has-file"));
  // Dans la version autonome, le faire-part définitif n'est cherché que s'il a été intégré
  if (!window.PQ_ASSETS || window.PQ_ASSETS["faire_part/faire_part.png"]) file.src = asset("faire_part/faire_part.png");

  let onReplay = null;
  root.addEventListener("click", (e) => {
    const go = e.target.closest("[data-go]");
    if (!go) return;
    if (go.dataset.go === "invite") {
      root.dataset.step = "invite";
      root.scrollTop = 0;
    } else {
      root.hidden = true;
      if (onReplay) onReplay();
    }
  });

  PQ.finale = {
    show(replay) {
      onReplay = replay;
      root.dataset.step = "photo";
      root.hidden = false;
      root.scrollTop = 0;
    },
    get step() {
      return root.hidden ? null : root.dataset.step;
    },
    // Remplace la carte provisoire par un faire-part propre au jeu (le fichier faire_part.png reste prioritaire)
    setInvite(node) {
      root.querySelector(".pq-card").replaceWith(node);
      node.classList.add("pq-card-custom");
    }
  };
})();
</script>
<script>
  // Écran agrandi à l'échelle entière la plus grande qui tient dans la fenêtre
  (function () {
    const cv = document.getElementById("screen");
    const pad = document.querySelector(".pad");
    function fit() {
      if (!cv.width) return;
      const padH = getComputedStyle(pad).display === "none" ? 0 : 170;
      const availW = Math.min(innerWidth - 60, 1300), availH = innerHeight - padH - 120;
      const s = Math.min(availW / cv.width, availH / cv.height);
      const k = s >= 1 ? Math.floor(s) : s;
      cv.style.width = Math.max(200, Math.round(cv.width * k)) + "px";
      cv.style.height = "auto";
    }
    addEventListener("resize", fit);
    window.PQfit = fit;
  })();
</script>
<script>
// PARADISE QUEST — jeu A, en deux versions qui partagent ce code et ses coordonnées (200 × 112) :
//  - pixel art (jeu_planche.html) : vrai pixel art PixelLab à la résolution du jeu (assets/scenes/, tools/pixellab_gen.py) ;
//  - HD (jeu_hd.html, window.PQ_HD) : images de style planche redessinées en grand par FLUX.2 (assets/hd/,
//    tools/hd_gen.py puis tools/hd_prep.py), 6 fois plus fines, dessinées lissées.
// Séquences : titre → aéroport → vol → La Digue → vélo → Anse Patate → demande → photo et faire-part.
(function () {
  "use strict";
  const PQ = window.PQ;
  const HD = !!window.PQ_HD;
  const E = PQ.moteurG(HD ? { w: 200, h: 112, px: 6, r: 6, smooth: true } : { w: 200, h: 112 });
  const { ctx, UI } = E;
  const W = E.W, S = E.S;
  window.PQfit && window.PQfit();

  const files = {}, DECORS = ["aeroport", "carte", "digue", "plage_arche", "faire_part", "route_fond", "route_sol"]; // HD : JPEG
  ["aeroport", "carte", "digue", "plage_arche", "faire_part", "max_genou", "max_debout", "max_joie",
    "flora_debout", "flora_surprise", "flora_joie", "velo", "noix", "avion", "bisou"]
    .concat(HD ? ["max_velo0", "route_fond", "route_sol", "route_barriere", "route_palmier", "route_rocher"]
      : ["max_velo", "max_velo_anim", "velo_route"])
    .forEach((n) => (files[n] = (HD ? "assets/hd/" : "assets/scenes/") + n + (HD && DECORS.includes(n) ? ".jpg" : ".png")));

  // Réglages relevés sur les images de chaque version (sol, trajet du vol, cocotiers, place de Flora sous l'arche)
  const G = HD ? {
    groundAirport: 104, groundDigue: 106, groundRoute: 96, groundPlage: 105,
    route: [[32, 26], [62, 38], [92, 52], [122, 64], [149, 73]],
    crowns: [], tile: 200, // route HD : couches (drawRoute)
    flora: 96, mapLabel: false,
    // étiquettes de la carte générée (texte déformé par l'IA) recouvertes par des plaques nettes (coordonnées d'interface)
    mapPlates: [[94, 5, 214, 33, "FRANCE  >  SEYCHELLES"], [268, 175, 98, 26, "SEYCHELLES"]],
    fpCenter: 0.578 // centre du parchemin du faire-part
  } : {
    groundAirport: 104, groundDigue: 106, groundRoute: 96, groundPlage: 104,
    route: [[34, 27], [60, 37], [90, 50], [120, 63], [147, 72]], // du drapeau français à l'épingle des Seychelles
    crowns: [20, 180], // couronnes des cocotiers de la route (x dans la tuile, répétée sans miroir)
    tile: 200, flora: 136, mapLabel: true, mapPlates: [], fpCenter: 0.565
  };

  const draw = (name, x, y) => E.blit(name, x, y);
  function shadow(x, y, rx) {
    ctx.fillStyle = "rgba(60,40,20,0.25)";
    ctx.beginPath();
    ctx.ellipse(Math.round(x), Math.round(y), rx || 10, 2, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  // Max à vélo : images du pédalage (planche horizontale de 64 × 64), ou l'image fixe s'il n'y en a pas. En HD, une seule
  // image (deux images générées séparément ne se superposent jamais exactement) animée par un léger rebond et la poussière
  let pedal = HD ? ["max_velo0"] : ["max_velo"];
  function splitPedal() {
    const strip = E.img.max_velo_anim;
    if (!strip) return;
    const n = Math.round(strip.width / strip.height);
    pedal = [];
    for (let i = 0; i < n; i++) {
      const c = document.createElement("canvas");
      c.width = c.height = strip.height;
      c.getContext("2d").drawImage(strip, -i * strip.height, 0);
      E.img["pedal" + i] = c;
      pedal.push("pedal" + i);
    }
  }
  function bike(x, feet, phase, moving) {
    if (HD && moving) { // poussière soulevée par la roue arrière, qui s'éloigne et s'efface
      for (let i = 0; i < 3; i++) {
        const k = (phase * 1.6 + i / 3) % 1;
        ctx.fillStyle = "rgba(236,214,170," + (0.55 * (1 - k)).toFixed(2) + ")";
        ctx.beginPath();
        ctx.arc(x - 20 - k * 14, feet - 1 - k * 4, 1.2 + k * 2.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    const bob = HD && moving ? (Math.floor(phase * 10) % 2) * 0.5 : 0; // rebond d'un demi-pixel du jeu
    E.sprite(moving ? pedal[Math.floor(phase * 8) % pedal.length] : pedal[0], x, feet + 1 - bob);
    if (HD) spokes(x, feet + 1 - bob, WHEELS.max_velo0, phase * 9);
  }
  // Rayons des roues (version HD) : positions relevées sur les images, depuis le bas-centre, en unités du jeu
  const WHEELS = { max_velo0: [[-13.3, -16.4, 14.6], [13.1, -16.3, 14.6]], velo: [[-13.1, -9.7, 11.2], [12.8, -10.7, 10.7]] };
  function spokes(x, feet, wheels, angle) {
    ctx.strokeStyle = "rgba(52,54,72,0.75)"; // rayons fins et sombres, comme ceux d'un vrai vélo
    ctx.lineWidth = 0.3;
    wheels.forEach(([dx, dy, r]) => {
      const cx = x + dx, cy = feet + dy, ri = r * 0.78;
      ctx.beginPath();
      for (let i = 0; i < 3; i++) { // 6 rayons
        const a = angle + (i * Math.PI) / 3;
        ctx.moveTo(cx - Math.cos(a) * ri, cy - Math.sin(a) * ri);
        ctx.lineTo(cx + Math.cos(a) * ri, cy + Math.sin(a) * ri);
      }
      ctx.stroke();
      ctx.fillStyle = "#2a2b36";
      ctx.beginPath();
      ctx.arc(cx, cy, 1.2, 0, Math.PI * 2);
      ctx.fill();
    });
  }
  function rider(x, feet, step, moving) {
    shadow(x + 2, feet, 18);
    bike(x, feet, step, moving);
  }
  // Logo en lettres dorées cernées de brun, comme celui de la planche
  function logo(s, y, size, cx) {
    const out = E.out;
    out.font = size + 'px "Press Start 2P", monospace';
    const x = Math.round((cx || (W * S) / 2) - out.measureText(s).width / 2);
    out.textBaseline = "top";
    out.fillStyle = "#3a2416";
    for (let dx = -3; dx <= 3; dx++) for (let dy = -3; dy <= 4; dy++) if (Math.abs(dx) + Math.abs(dy) >= 3) out.fillText(s, x + dx, y + dy);
    out.fillStyle = "#e07a1e";
    out.fillText(s, x, y + 2);
    out.fillStyle = "#ffd34d";
    out.fillText(s, x, y);
  }
  function label(s, x, y) {
    E.out.font = '8px "Press Start 2P", monospace';
    const w = E.out.measureText(s).width;
    E.plate(x, y, w + 24, 22);
    E.text(s, x + 12, y + 7, UI.gold);
  }

  const sc = E.scenes;

  // ----------------------------------------------------------------- 1. Titre
  sc.title = {
    enter() {},
    update() {
      if (E.anyPress()) E.go("airport");
    },
    draw(t) {
      draw("aeroport", 0, 0);
      const g = G.groundAirport;
      shadow(34, g, 9);
      shadow(58, g, 9);
      E.sprite("max_debout", 34, g + 1);
      E.sprite("flora_debout", 58, g + 1 - (Math.floor(t * 2) % 2));
      E.heart(43, g - 66 - (Math.floor(t * 3) % 2), UI.rose);
    },
    ui(t) {
      const cx = 262;
      logo("PARADISE", 34, 22, cx);
      logo("QUEST", 64, 22, cx);
      E.out.font = '8px "Press Start 2P", monospace';
      const sub = "Flora & Maxime", subW = E.out.measureText(sub).width;
      E.plate(cx - subW / 2 - 12, 102, subW + 24, 22);
      E.text(sub, cx - subW / 2, 109, UI.white);
      if (Math.floor(t * 1.6) % 2 === 0) {
        const ps = "PRESS START", psW = E.out.measureText(ps).width;
        E.plate(cx - psW / 2 - 12, 172, psW + 24, 22);
        E.text(ps, cx - psW / 2, 179, UI.gold);
      }
    }
  };

  // ----------------------------------------------------------------- 2. Aéroport : le départ (personne ne marche)
  sc.airport = {
    enter() {
      this.timer = 0;
      this.said = false;
    },
    update(dt) {
      this.timer += dt;
      if (!this.said && this.timer > 0.6) {
        this.said = true;
        E.say([
          { who: "FLORA", text: "Direction les Seychelles !" },
          { who: "MAXIME", text: "Notre plus beau voyage commence..." }
        ], () => E.go("flight"));
      }
    },
    draw(t) {
      draw("aeroport", 0, 0);
      const g = G.groundAirport;
      shadow(70, g, 9);
      shadow(94, g, 9);
      E.sprite("max_debout", 70, g + 1);
      E.sprite("flora_debout", 94, g + 1);
    },
    ui() {
      label("FRANCE", 10, 10);
    }
  };

  // ----------------------------------------------------------------- 3. Vol France → Seychelles
  sc.flight = {
    enter() {
      const pts = G.route;
      this.len = [0];
      for (let i = 1; i < pts.length; i++) this.len.push(this.len[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
      this.p = 0;
      this.wait = 1.2;
    },
    at(d) {
      const pts = G.route, len = this.len;
      let i = 1;
      while (i < len.length - 1 && len[i] < d) i++;
      const k = (d - len[i - 1]) / Math.max(0.01, len[i] - len[i - 1]);
      return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * k, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * k];
    },
    update(dt) {
      if (this.p < 1) {
        this.p = Math.min(1, this.p + dt / 3);
        if (E.anyPress()) this.p = 1;
      } else if ((this.wait -= dt) <= 0) E.go("digue");
    },
    draw(t) {
      draw("carte", 0, 0);
      const total = this.len[this.len.length - 1], d = total * this.p;
      for (let s = 0; s < d - 8; s += 5) {
        const [x, y] = this.at(s);
        ctx.fillStyle = "#1e2236";
        ctx.fillRect(Math.round(x), Math.round(y) + 1, 2, 2);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(Math.round(x), Math.round(y), 2, 2);
      }
      const [px, py] = this.at(d);
      E.sprite("avion", px, py + E.size("avion").h / 2 + Math.sin(t * 4));
    },
    ui() {
      if (G.mapLabel) label("FRANCE  >  SEYCHELLES", 100, 10);
      G.mapPlates.forEach(([x, y, w, h, s]) => {
        E.plate(x, y, w, h);
        E.out.font = '8px "Press Start 2P", monospace';
        E.text(s, Math.round(x + (w - E.out.measureText(s).width) / 2), Math.round(y + (h - 8) / 2), UI.white);
      });
    }
  };

  // ----------------------------------------------------------------- 4. La Digue : Max arrive à vélo
  sc.digue = {
    enter() {
      this.x = -40;
      this.step = 0;
      this.phase = 0;
    },
    update(dt) {
      if (this.phase === 0) {
        this.x += 40 * dt;
        this.step += dt;
        if (this.x >= 60) {
          this.phase = 1;
          E.say([
            { text: "La Digue, Seychelles." },
            { who: "MAXIME", text: "Flora est partie devant, direction Anse Patate..." },
            { who: "MAXIME", text: "Je la rejoins à vélo !" }
          ], () => (this.phase = 2));
        }
      } else if (this.phase === 2) {
        this.x += 70 * dt;
        this.step += dt;
        if (this.x > 230) E.go("velo");
      }
    },
    draw() {
      draw("digue", 0, 0);
      rider(this.x, G.groundDigue, this.step, this.phase !== 1);
    },
    ui() {
      label("LA DIGUE", 10, 10);
    }
  };

  // ----------------------------------------------------------------- 5. Parcours à vélo
  // Route HD en couches : fond (ciel, mer, île) qui défile lentement, puis palmiers, rochers, barrière et sable
  const PALMS = [], ROCKS = [], FENCE_Y = 68, PALM_CROWN = [4, FENCE_Y + 2 - 46]; // noix de coco du palmier (x relatif, y)
  for (let x = 70, i = 0; x < 1500; i++) {
    PALMS.push(x);
    if (i % 2 === 0) ROCKS.push(x + 52);
    x += 105 + ((i * 37) % 3) * 22; // espacement irrégulier mais fixe
  }
  function strip(name, cam, speed, y) {
    const w = E.size(name).w, off = (((cam * speed) % w) + w) % w;
    for (let x = -off; x < W; x += w) E.blit(name, x, y);
  }
  function drawRoute(cam) {
    strip("route_fond", cam, 0.3, 0);
    strip("route_sol", cam, 1, E.H - E.size("route_sol").h); // sable (bord haut : y = 64) et buissons
    ROCKS.forEach((x) => x - cam > -40 && x - cam < W + 40 && E.sprite("route_rocher", x - cam, FENCE_Y));
    PALMS.forEach((x) => x - cam > -40 && x - cam < W + 40 && E.sprite("route_palmier", x - cam, FENCE_Y + 2));
    strip("route_barriere", cam, 1, FENCE_Y + 3 - E.size("route_barriere").h);
  }
  const TILE = G.tile, LENGTH = 1120, BIKE_X = 44, NUT_GAP = 170; // une noix à la fois, espacées de NUT_GAP
  sc.velo = {
    BIKE_X,
    enter() {
      this.d = 0;
      this.speed = 70;
      this.h = 0;
      this.vy = 0;
      this.lives = 3;
      this.hits = 0;
      this.inv = 0;
      this.nuts = [];
      this.nextNut = 120; // distance parcourue à partir de laquelle la prochaine noix peut tomber
    },
    hit() {
      this.hits++;
      this.lives--;
      this.inv = 1.3;
      // Les invités ne sont pas tous joueurs : après 3 chocs, Max reprend son souffle et repart d'où il était
      if (this.lives <= 0) {
        E.say([{ text: "Aïe ! Trop de noix de coco... Max reprend son souffle. C'est reparti !" }], () => {
          this.lives = 3;
          this.nuts = this.nuts.filter((n) => n.x > this.d + BIKE_X + 100);
        });
      }
    },
    update(dt) {
      const g = G.groundRoute;
      if (this.d >= LENGTH) {
        E.go("plage");
        return;
      }
      const target = 70 + (E.input.right ? 24 : 0) - (E.input.left ? 24 : 0);
      this.speed += (target - this.speed) * Math.min(1, dt * 3);
      this.d += this.speed * dt;
      if ((E.consume("b") || E.consume("a") || E.input.up) && this.h === 0) this.vy = 200; // saut haut et long : une noix se franchit sans viser au pixel près
      this.vy -= 520 * dt;
      this.h = Math.max(0, this.h + this.vy * dt);
      if (this.h === 0) this.vy = 0;
      this.inv = Math.max(0, this.inv - dt);
      // Une seule noix de coco à la fois : elle tombe du prochain cocotier quand la précédente est passée
      if (!this.nuts.length && this.d >= this.nextNut && this.d < LENGTH - 160) {
        if (HD) { // depuis la couronne du prochain palmier posé sur la route
          const p = PALMS.find((px) => px - this.d > 130 && px - this.d < 260);
          if (p !== undefined) this.nuts.push({ x: p + PALM_CROWN[0], y: PALM_CROWN[1], vy: 0, falling: true });
        } else {
          for (let k = Math.floor(this.d / TILE); k <= Math.floor(this.d / TILE) + 2 && !this.nuts.length; k++) {
            G.crowns.forEach((cx) => {
              const x = k * TILE + cx;
              if (!this.nuts.length && x - this.d > 130 && x - this.d < 240) this.nuts.push({ x, y: 12, vy: 0, falling: true });
            });
          }
        }
        this.nextNut = this.d + NUT_GAP;
      }
      const mx = this.d + BIKE_X;
      this.nuts.forEach((n) => {
        if (n.falling) {
          n.vy += 240 * dt;
          n.y += n.vy * dt;
          if (n.y >= g - 1) {
            n.y = g - 1;
            n.falling = false;
          }
        }
        if (n.hit || this.inv > 0 || E.talking) return;
        const dx = Math.abs(n.x - mx);
        const top = g - 56 - this.h, bottom = g - this.h;
        if (n.falling ? dx < 8 && n.y > top + 8 && n.y < bottom : dx < 9 && this.h < 6) {
          n.hit = true;
          this.hit();
        }
      });
      this.nuts = this.nuts.filter((n) => !n.hit && n.x - this.d > -30);
    },
    draw(t) {
      const cam = HD ? this.d : Math.round(this.d), g = G.groundRoute;
      if (HD) drawRoute(cam);
      else for (let k = Math.floor(cam / TILE); k <= Math.floor(cam / TILE) + 1; k++) E.blit("velo_route", k * TILE - cam, 0);
      this.nuts.forEach((n) => {
        const x = Math.round(n.x - cam);
        if (n.falling) {
          const k = Math.min(1, (n.y - 12) / (g - 14));
          ctx.fillStyle = "rgba(60,40,20,0.3)";
          if (HD) { // ombre ronde qui grandit à l'approche du sol
            ctx.beginPath();
            ctx.ellipse(x, g, 1.5 + k * 3.5, 0.6 + k * 0.8, 0, 0, Math.PI * 2);
            ctx.fill();
          } else ctx.fillRect(x - 2 - k * 3, g, 4 + k * 6, 2);
        }
        E.sprite("noix", x, Math.round(n.y) + 1);
      });
      shadow(BIKE_X + 2, g, 16);
      if (this.inv <= 0 || Math.floor(t * 16) % 2) {
        bike(BIKE_X, g - this.h, this.d / 64, this.h === 0);
      }
      for (let i = 0; i < 3; i++) E.heart(4 + i * 10, 4, i < this.lives ? UI.rose : "rgba(40,30,50,0.35)");
    },
    ui() {
      const x = W * S - 170, y = 8;
      E.plate(x, y, 160, 30);
      E.text("ANSE PATATE", x + 12, y + 6, UI.gold);
      E.out.fillStyle = UI.plateEdge;
      E.out.fillRect(x + 12, y + 20, 136, 3);
      E.out.fillStyle = UI.rose;
      E.out.fillRect(x + 12 + Math.round((132 * Math.min(this.d, LENGTH)) / LENGTH), y + 17, 4, 9);
      if (this.d < 70 * 3.5) { // à droite, sous la jauge : loin de Max
        E.plate(x - 64, y + 40, 224, 40);
        E.text("ESPACE ou B : SAUTER", x - 52, y + 48, UI.gold);
        E.text("< > : CHANGER DE VITESSE", x - 52, y + 63, UI.gold);
      }
    }
  };

  // ----------------------------------------------------------------- 6. Anse Patate et demande (Max arrive à vélo)
  const ANSWERS = [{ label: "OUI !", say: "Oui ! Pour toujours..." }, { label: "MILLE FOIS OUI !", say: "Oui, mille fois oui !" }];
  const FLORA_X = G.flora, MAX_STOP = FLORA_X - 40; // Max à vélo s'arrête là, à quelques pas de Flora
  sc.plage = {
    enter() {
      this.max = { x: -40, step: 0, moving: false };
      this.phase = "arrive";
      this.timer = 0;
      this.bikeX = null;
      this.hearts = [];
      this.near = false;
      this.choice = 0;
    },
    burst(n) {
      for (let i = 0; i < n; i++) {
        this.hearts.push({ x: FLORA_X - 16 + (Math.random() - 0.5) * 80, y: 34 + Math.random() * 14, // au-dessus des têtes
          vy: 12 + Math.random() * 16, life: 2 + Math.random() * 2 });
      }
    },
    update(dt) {
      this.timer += dt;
      this.hearts.forEach((h) => { h.y -= h.vy * dt; h.life -= dt; });
      this.hearts = this.hearts.filter((h) => h.life > 0);
      const m = this.max;
      switch (this.phase) {
        case "arrive":
          // Max arrive tout seul à vélo, pose son vélo et se retrouve face à Flora
          m.x = Math.min(MAX_STOP, m.x + 50 * dt);
          m.step += dt;
          m.moving = true;
          if (m.x >= MAX_STOP) {
            m.moving = false;
            this.bikeX = MAX_STOP - 26;
            this.phase = "talk";
            E.say([{ who: "MAXIME", text: "Flora ! Je t'ai enfin retrouvée..." }], () => { this.phase = "ready"; this.timer = 0; });
          }
          break;
        case "ready":
          // Le joueur n'a plus qu'à appuyer (Espace, A, Entrée ou toucher l'écran) pour faire la demande
          this.near = true;
          if (E.anyPress()) {
            this.phase = "kneel";
            this.timer = 0;
            this.near = false;
          }
          break;
        case "kneel":
          if (this.timer > 0.8) {
            this.phase = "ask";
            E.say([
              { who: "MAXIME", text: "Et si on écrivait la suite de notre histoire ensemble ?" },
              { who: "MAXIME", text: "Veux-tu m'épouser ?" }
            ], () => { this.phase = "answer"; this.timer = 0; });
          }
          break;
        case "answer":
          // C'est le joueur (Flora !) qui répond : deux réponses possibles... et toutes les deux disent oui
          if (E.tap("left") || E.tap("up")) this.choice = 0;
          if (E.tap("right") || E.tap("down")) this.choice = 1;
          if (this.timer > 0.4 && E.anyPress()) {
            this.phase = "yes";
            E.say([{ who: "FLORA", text: ANSWERS[this.choice].say }], () => { this.phase = "joy"; this.timer = 0; this.burst(14); });
          }
          break;
        case "joy":
          if (Math.random() < dt * 6) this.burst(1);
          if (this.timer > 2.2) { // après avoir sauté de joie, ils s'embrassent
            this.phase = "kiss";
            this.timer = 0;
            this.burst(6);
          }
          break;
        case "kiss":
          if (Math.random() < dt * 4) this.burst(1);
          if (this.timer > 2.8) E.go("reveal", "#ffffff");
          break;
      }
    },
    draw(t) {
      draw("plage_arche", 0, 0);
      const m = this.max, p = this.phase, g = G.groundPlage;
      const kneeling = ["kneel", "ask", "answer", "yes"].includes(p);
      if (this.bikeX !== null) {
        shadow(this.bikeX, g, 16);
        E.sprite("velo", this.bikeX, g + 1);
      }
      const kx = FLORA_X - 30;
      if (p === "kiss") { // le couple enlacé, entre les places de Max et de Flora
        shadow(FLORA_X - 15, g, 14);
        E.sprite("bisou", FLORA_X - 15, g + 1);
      } else {
        shadow(FLORA_X, g, 9);
        if (p === "joy") E.sprite("flora_joie", FLORA_X, g + 1 - (Math.floor(t * 5) % 2) * 2);
        else if (kneeling) E.sprite("flora_surprise", FLORA_X, g + 1 - (p === "yes" ? Math.floor(t * 6) % 2 : 0));
        else E.sprite("flora_debout", FLORA_X, g + 1);
      }
      if (p === "kiss") {
        // Max est dans le dessin du couple
      } else if (kneeling) {
        shadow(kx, g, 11);
        E.sprite("max_genou", kx, g + 1);
        if (Math.floor(t * 4) % 2) { // éclat de la bague
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(kx + 13, g - 34, 1, 3);
          ctx.fillRect(kx + 12, g - 33, 3, 1);
        }
      } else if (p === "joy") {
        shadow(kx, g, 10);
        E.sprite("max_joie", kx, g + 1 - (Math.floor(t * 5 + 1) % 2) * 2);
      } else if (this.bikeX !== null) { // vélo posé : Max debout face à Flora
        shadow(kx, g, 9);
        E.sprite("max_debout", kx, g + 1);
      } else {
        rider(m.x, g, m.step, m.moving);
      }
      if (p === "ready") E.heart(FLORA_X - 3, g - 64 - (Math.floor(t * 3) % 2), UI.rose);
      this.hearts.forEach((h) => E.heart(Math.round(h.x + Math.sin(h.y * 0.1) * 4), Math.round(h.y), UI.rose));
    },
    ui() {
      if (this.phase === "ready") E.centerPlate(["ESPACE ou A : FAIRE MA DEMANDE"], 12, UI.gold);
      if (this.phase === "answer") {
        // Bulle de réponse : « Veux-tu m'épouser ? » rappelé, puis les deux réponses côte à côte
        E.centerPlate(["VEUX-TU M'EPOUSER ?"], 12, UI.white);
        const out = E.out, y = 52;
        out.font = '8px "Press Start 2P", monospace';
        const ws = ANSWERS.map((a) => out.measureText(a.label).width + 40);
        let x = Math.round((W * S - ws[0] - ws[1] - 16) / 2);
        ANSWERS.forEach((a, i) => {
          const on = this.choice === i;
          E.plate(x, y, ws[i], 26);
          if (on) {
            out.fillStyle = UI.rose;
            out.fillRect(x + 2, y + 2, ws[i] - 4, 22);
          }
          E.text((on ? "> " : "  ") + a.label, x + 10, y + 9, on ? UI.white : UI.gold);
          x += ws[i] + 16;
        });
        E.centerPlate(["< > CHOISIR  -  ESPACE VALIDER"], 88, UI.white);
      }
    }
  };

  // ----------------------------------------------------------------- 7. Photo de la demande et faire-part
  function invite() {
    const card = E.img.faire_part, k = HD ? 1 : 4; // pixel art agrandi 4 fois ; HD déjà en grand
    const c = document.createElement("canvas");
    c.width = card.width * k;
    c.height = card.height * k;
    const g = c.getContext("2d");
    g.imageSmoothingEnabled = false;
    g.drawImage(card, 0, 0, c.width, c.height);
    g.textAlign = "center";
    g.textBaseline = "middle";
    const cx = c.width * G.fpCenter; // centre du parchemin (décalé à droite des palmiers)
    const line = (s, y, size, color) => {
      g.font = Math.round((size * c.width) / 976) + 'px "Press Start 2P", monospace'; // tailles données pour 976 px
      g.fillStyle = "#fff4dc";
      g.fillText(s, cx + 2, y + 2);
      g.fillStyle = color;
      g.fillText(s, cx, y);
    };
    line("THE NEXT LEVEL", c.height * 0.2, 18, "#7b4a24");
    line("FLORA & MAXIME", c.height * 0.4, 32, "#a4321e");
    line("28 août 2027", c.height * 0.6, 22, "#7b4a24");
    line("Une nouvelle aventure commence...", c.height * 0.79, 12, "#7b4a24");
    c.setAttribute("role", "img");
    c.setAttribute("aria-label", "Faire-part : The next level. Flora & Maxime, 28 août 2027. Une nouvelle aventure commence...");
    c.className = "pq-fp-card";
    // La photo de face (la bague au doigt) posée comme un polaroïd sur le bord du faire-part (css/finale.css)
    const box = document.createElement("div");
    box.className = "pq-fp";
    const fig = document.createElement("figure");
    fig.className = "pq-polaroid pq-fp-photo";
    const photo = document.createElement("img");
    photo.src = PQ.asset("assets/photos/arche_bague.jpeg");
    photo.alt = "Flora et Maxime de face sous l'arche fleurie, la bague au doigt";
    fig.append(photo);
    box.append(fig, c);
    return box;
  }
  let inviteSet = false;
  sc.reveal = {
    enter() {
      if (!inviteSet && E.img.faire_part) {
        PQ.finale.setInvite(invite());
        // La plage d'Anse Patate en fond de la page du faire-part
        const root = document.getElementById("pq-finale");
        root.classList.add("pq-fp-scene");
        // adresse absolue : une adresse relative dans une variable CSS serait résolue depuis css/
        root.style.setProperty("--pq-fp-bg", 'url("' + new URL(PQ.asset(files.plage_arche), location.href).href + '")');
        inviteSet = true;
      }
      PQ.finale.show(() => E.go("title"));
    },
    update() {},
    draw() {
      draw("plage_arche", 0, 0);
    }
  };

  E.load(files).then(() => {
    splitPedal();
    window.PQfit && window.PQfit();
    E.run("title");
  });
})();
</script>
